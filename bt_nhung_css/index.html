<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài tập Nhúng CSS</title>

    <!-- PHẦN 3: External CSS (Nhúng file css riêng biệt) -->
    <link rel="stylesheet" href="style.css">

    <!-- PHẦN 2: Internal CSS (Khai báo trong cặp thẻ style) -->
    <style>
        .internal-heading {
            color: green;
        }
    </style>
</head>
<body>

    <!-- PHẦN 1: Inline CSS (Thay đổi trực tiếp bằng thuộc tính style) -->
    <h1 style="color: green;">This is heading 1</h1>

    <!-- PHẦN 2 & 3: Sử dụng Internal hoặc External cho đoạn văn bản -->
    <p>This is an ordinary paragraph. Notice that this text is blue. The default text color for a page is defined in the body selector.</p>

</body>
</html>
