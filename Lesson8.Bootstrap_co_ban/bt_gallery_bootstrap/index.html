<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Bootstrap Gallery</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 40px 0;
        }
        .gallery-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 15px;
        }
        .gallery-title {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            color: #333;
        }
        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .gallery-item {
            /* Mặc định trên màn hình lớn (>700px): Hiển thị 4 ảnh trên 1 dòng (tính cả gap) */
            flex: 0 0 calc(25% - 15px);
            box-sizing: border-box;
        }
        .gallery-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .gallery-item img:hover {
            transform: scale(1.03);
        }

        /* Responsive theo yêu cầu bài toán */
        /* Màn hình nhỏ hơn 700px: Hiển thị 2 ảnh trên 1 dòng */
        @media (max-width: 700px) {
            .gallery-item {
                flex: 0 0 calc(50% - 10px);
            }
        }

        /* Màn hình nhỏ hơn 500px: Hiển thị 1 ảnh trên 1 dòng */
        @media (max-width: 500px) {
            .gallery-item {
                flex: 0 0 100%;
            }
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <h2 class="gallery-title">Simple Photo Gallery</h2>
        
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1015/400/300" alt="Gallery Image 1">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1016/400/300" alt="Gallery Image 2">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1019/400/300" alt="Gallery Image 3">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1025/400/300" alt="Gallery Image 4">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1035/400/300" alt="Gallery Image 5">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1043/400/300" alt="Gallery Image 6">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1050/400/300" alt="Gallery Image 7">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1062/400/300" alt="Gallery Image 8">
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
