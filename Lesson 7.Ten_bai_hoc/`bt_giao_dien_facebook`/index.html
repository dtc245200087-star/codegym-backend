<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facebook Simplified</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="fixed-header">
        <div class="header-left">facebook</div>
        <div class="header-center">
            <input type="text" placeholder="Search Facebook">
        </div>
        <div class="header-right">
            <span>Menu</span>
            <span>Messenger</span>
            <span>Notifications</span>
            <span>Account</span>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar-left">
            <ul>
                <li>👤 Profile</li>
                <li>👥 Friends</li>
                <li>💾 Saved</li>
                <li>📺 Watch</li>
                <li>🕒 Memories</li>
            </ul>
        </aside>

        <main class="content">
            <div class="create-post">
                <input type="text" placeholder="What's on your mind?">
            </div>
            <div class="post">
                <h3>User Name</h3>
                <p>This is a simplified Facebook news feed post content.</p>
            </div>
        </main>

        <aside class="sidebar-right">
            <h3>Contacts</h3>
            <ul>
                <li>🟢 Friend 1</li>
                <li>🟢 Friend 2</li>
                <li>🟢 Friend 3</li>
            </ul>
        </aside>
    </div>
</body>
</html>
